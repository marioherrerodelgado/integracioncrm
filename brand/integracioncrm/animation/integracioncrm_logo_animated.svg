<defs>
  <linearGradient id="g" x1="0%" y1="0%" x2="70%" y2="100%">
    <stop offset="0%" stop-color="#081426"/>
    <stop offset="100%" stop-color="#0A5F4B"/>
  </linearGradient>
</defs>
<style>
  .ring { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 2.8s cubic-bezier(.2,.7,.2,1) infinite; }
  .a { transform-box: fill-box; transform-origin: center; animation: popA 2.8s cubic-bezier(.2,.8,.2,1) infinite; }
  .b { transform-box: fill-box; transform-origin: center; animation: popB 2.8s cubic-bezier(.2,.8,.2,1) infinite; }
  .word { opacity: 0; animation: word 2.8s ease infinite; }
  @keyframes draw {
    0%,8% { stroke-dashoffset:420; opacity:0; }
    14% { opacity:1; }
    45%,82% { stroke-dashoffset:0; opacity:1; }
    100% { stroke-dashoffset:0; opacity:0; }
  }
  @keyframes popA {
    0%,18% { opacity:0; transform:translate(-14px,-14px) scale(.72); }
    38%,82% { opacity:1; transform:translate(0,0) scale(1); }
    100% { opacity:0; transform:scale(.96); }
  }
  @keyframes popB {
    0%,25% { opacity:0; transform:translate(14px,14px) scale(.72); }
    45%,82% { opacity:1; transform:translate(0,0) scale(1); }
    100% { opacity:0; transform:scale(.96); }
  }
  @keyframes word {
    0%,34% { opacity:0; transform:translateX(12px); }
    52%,82% { opacity:1; transform:translateX(0); }
    100% { opacity:0; }
  }
</style>
